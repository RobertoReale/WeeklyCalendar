; The red line of the current time: above the events, under the card
[NowLine]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden

; The card (Calendar.lua: layoutCard): create form, details of an item, edit form.
; CrDismiss catches clicks outside the card and closes it; CrCard draws the card (shadow,
; fields, button backgrounds); CrTx1..20 are its texts and buttons.
[CrDismiss]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden
MouseActionCursor=0
LeftMouseDownAction=[!SetVariable WCPressed 1]
LeftMouseUpAction=[!CommandMeasure MeasureScript "CardClose()"]
RightMouseUpAction=[!CommandMeasure MeasureScript "CardClose()"]
MouseScrollUpAction=[!SetVariable WCPressed 1]
MouseScrollDownAction=[!SetVariable WCPressed 1]

[CrCard]
