;  WeeklyCalendar - Google Calendar-style weekly view for Rainmeter
;  Settings (colors, dimensions, etc.) are in @Resources\Settings.inc.
;  Private calendar URLs are in @Resources\Private.inc (not tracked by git).
;  Logic is in @Resources\Calendar.lua.

[Rainmeter]
Update=1000
AccurateText=1
OnRefreshAction=[!ZPos #ZPos#]
MouseScrollUpAction=[!CommandMeasure MeasureScript "ScrollHours(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureScript "ScrollHours(1)"]
ContextTitle=Refresh now
ContextAction=[!CommandMeasure MeasureScript "Refresh()"]
ContextTitle2=Today (Current week)
ContextAction2=[!CommandMeasure MeasureScript "GoToday()"]
ContextTitle3=Scroll up (earlier hours)
ContextAction3=[!CommandMeasure MeasureScript "ScrollHours(-1)"]
ContextTitle4=Scroll down (later hours)
ContextAction4=[!CommandMeasure MeasureScript "ScrollHours(1)"]
ContextTitle5=Reset scroll
ContextAction5=[!CommandMeasure MeasureScript "ResetScroll()"]
ContextTitle6=Calendar settings
ContextAction6=["#CONFIGEDITOR#" "#@#Settings.inc"]
ContextTitle7=Calendar addresses
ContextAction7=["#CONFIGEDITOR#" "#@#Private.inc"]

[Metadata]
Name=WeeklyCalendar
Author=Roberto Reale
Information=Weekly Google Calendar-style view powered by iCal (.ics) feeds. Supports vertical hour scrolling, auto-shift for evening events, and week navigation.
Version=1.1.0
License=CC0

@includeSettings=#@#Settings.inc
; Private calendar addresses (ignored by git; created by Calendar.lua on first load)
@includePrivate=#@#Private.inc

[MeasureScript]
Measure=Script
ScriptFile=#@#Calendar.lua
UpdateDivider=10

[MeasureICS1]
Measure=WebParser
URL=#IcalUrl1#
Download=1
DownloadFile=calendar1.ics
UpdateRate=(#RefreshMinutes#*60)
FinishAction=[!CommandMeasure MeasureScript "Reload(1)"]
OnConnectErrAction=[!CommandMeasure MeasureScript "NetError(1)"]
OnDownloadErrAction=[!CommandMeasure MeasureScript "NetError(1)"]

[MeasureICS2]
Measure=WebParser
URL=#IcalUrl2#
Download=1
DownloadFile=calendar2.ics
UpdateRate=(#RefreshMinutes#*60)
FinishAction=[!CommandMeasure MeasureScript "Reload(2)"]
OnConnectErrAction=[!CommandMeasure MeasureScript "NetError(2)"]
OnDownloadErrAction=[!CommandMeasure MeasureScript "NetError(2)"]

[MeasureICS3]
Measure=WebParser
URL=#IcalUrl3#
Download=1
DownloadFile=calendar3.ics
UpdateRate=(#RefreshMinutes#*60)
FinishAction=[!CommandMeasure MeasureScript "Reload(3)"]
OnConnectErrAction=[!CommandMeasure MeasureScript "NetError(3)"]
OnDownloadErrAction=[!CommandMeasure MeasureScript "NetError(3)"]

[StyCal]
Group=Cal
UpdateDivider=-1

[StyShape]
Shape=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0

[StyStr]
FontFace=#FontFace#
FontSize=#FontSize#
FontWeight=400
AntiAlias=1
FontColor=#DayNumColor#
Text=

[StyHidden]
Hidden=1

[StyBold]
FontWeight=600

[StySub]
FontSize=(#FontSize#-0.5)
FontWeight=400

[StyClip]
ClipString=1
W=10
H=10

[StyWeekScroll]
MouseScrollUpAction=[!CommandMeasure MeasureScript "ShiftWeek(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureScript "ShiftWeek(1)"]

[BG]
Meter=Shape
Shape=Rectangle 0,0,#Width#,#Height#,#BgRadius# | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #GridColor#

[Grid]
Meter=Shape
MeterStyle=StyCal | StyShape

[CalLogo]
Meter=Shape
MeterStyle=StyCal | StyShape | StyWeekScroll
LeftMouseUpAction=["https://calendar.google.com"]
ToolTipText=Open Google Calendar

[CalLogoTxt]
Meter=String
MeterStyle=StyCal | StyStr | StyWeekScroll
StringAlign=CenterCenter
FontColor=255,255,255,255
FontSize=11
FontWeight=700
LeftMouseUpAction=["https://calendar.google.com"]

[CalAppTitle]
Meter=String
MeterStyle=StyCal | StyStr | StyWeekScroll
StringAlign=LeftCenter
FontColor=#DayNumColor#
FontSize=13
FontWeight=500
Text=Calendar
LeftMouseUpAction=["https://calendar.google.com"]
ToolTipText=Open Google Calendar

[BtnToday]
Meter=Shape
MeterStyle=StyCal | StyShape | StyWeekScroll
LeftMouseUpAction=[!CommandMeasure MeasureScript "GoToday()"]
ToolTipText=Today

[BtnTodayTxt]
Meter=String
MeterStyle=StyCal | StyStr | StyWeekScroll
StringAlign=CenterCenter
FontSize=9.5
FontWeight=500
Text=Today
LeftMouseUpAction=[!CommandMeasure MeasureScript "GoToday()"]

[BtnPrev]
Meter=Shape
MeterStyle=StyCal | StyShape | StyWeekScroll
LeftMouseUpAction=[!CommandMeasure MeasureScript "ShiftWeek(-1)"]
ToolTipText=Previous week

[BtnPrevTxt]
Meter=String
MeterStyle=StyCal | StyStr | StyWeekScroll
StringAlign=CenterCenter
FontSize=15
FontWeight=600
Text=<
LeftMouseUpAction=[!CommandMeasure MeasureScript "ShiftWeek(-1)"]

[BtnNext]
Meter=Shape
MeterStyle=StyCal | StyShape | StyWeekScroll
LeftMouseUpAction=[!CommandMeasure MeasureScript "ShiftWeek(1)"]
ToolTipText=Next week

[BtnNextTxt]
Meter=String
MeterStyle=StyCal | StyStr | StyWeekScroll
StringAlign=CenterCenter
FontSize=15
FontWeight=600
Text=>
LeftMouseUpAction=[!CommandMeasure MeasureScript "ShiftWeek(1)"]

[TbTitle]
Meter=String
MeterStyle=StyCal | StyStr | StyWeekScroll
StringAlign=LeftCenter
FontSize=#TitleFontSize#
FontWeight=500

[TbWeekBg]
Meter=Shape
MeterStyle=StyCal | StyShape | StyWeekScroll

[TbWeek]
Meter=String
MeterStyle=StyCal | StyStr | StyWeekScroll
StringAlign=CenterCenter
FontColor=#BadgeTextColor#
FontSize=8.5
FontWeight=500

[TbSync]
Meter=String
MeterStyle=StyCal | StyStr | StyWeekScroll
StringAlign=RightCenter
FontColor=#MutedColor#
FontSize=8
LeftMouseUpAction=[!CommandMeasure MeasureScript "Refresh()"]
ToolTipText=Click to sync now

[TzLabel]
Meter=String
MeterStyle=StyCal | StyStr
StringAlign=RightCenter
FontColor=#MutedColor#
FontSize=8

[BtnUpHour]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden
LeftMouseUpAction=[!CommandMeasure MeasureScript "ScrollHours(-1)"]
ToolTipText=Scroll up (earlier hours)

[BtnUpHourTxt]
Meter=String
MeterStyle=StyCal | StyStr | StyHidden
StringAlign=CenterCenter
FontSize=9
FontWeight=700
FontColor=#MutedColor#
Text=[\x25B2]
LeftMouseUpAction=[!CommandMeasure MeasureScript "ScrollHours(-1)"]

[BtnDownHour]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden
LeftMouseUpAction=[!CommandMeasure MeasureScript "ScrollHours(1)"]
ToolTipText=Scroll down (later hours)

[BtnDownHourTxt]
