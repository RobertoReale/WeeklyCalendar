MeterStyle=StyCal | StyStr | StyHidden | StyItem
StringAlign=CenterCenter
FontWeight=600
LeftMouseUpAction=[!CommandMeasure MeasureScript "ItemUndo()"]

[Status]
Meter=String
MeterStyle=StyCal | StyStr | StyHidden
X=(#Width#/2)
Y=(#Height#/2)
StringAlign=CenterCenter
FontColor=116,119,117,255
FontSize=11

