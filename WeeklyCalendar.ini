; Keeps what is typed in the cards' boxes, and dialogs (e.g. "Empty Recycle Bin") above the
; calendar unless KeepDialogsOnTop=0: see @Resources\ZOrder. Started by Calendar.lua (StartHelper).
[MeasureZOrderHelper]
Measure=Plugin
Plugin=RunCommand
Program=cmd.exe
Parameter=/c "#@#ZOrder\launch.cmd"
StartInFolder=#@#ZOrder
State=Hide
Timeout=120000

; Marks Google Tasks completed / not completed from the skin (tools\GoogleTasksFeed.gs).
; Calendar.lua sets the address and runs it; curl.exe is part of Windows 10 and 11.
[MeasureTaskAction]
Measure=Plugin
Plugin=RunCommand
Program=curl.exe
Parameter=
State=Hide
OutputType=UTF8
Timeout=40000
FinishAction=[!CommandMeasure MeasureScript "TaskResult()"]

; Ticks every second while a deletion can still be undone (Calendar.lua enables it)
[MeasureTick]
Measure=Calc
Formula=1
UpdateDivider=1
Disabled=1
OnUpdateAction=[!CommandMeasure MeasureScript "Tick()"]

; Box to type the title, notes, place or description in the create / edit card (Calendar.lua:
; layoutCard sets its place, size, font size and limit). Enter runs Command1; Esc or a click
; elsewhere closes the box (the card stays, with the text the ZOrder helper copied). Triple
; quotes keep titles with ".
[MeasureCreateInput]
Measure=Plugin
Plugin=InputText
FontFace=#FontFace#
FontSize=13
FocusDismiss=1
TopMost=1
InputLimit=500
DefaultValue=
X=0
Y=0
W=200
H=30
Command1=[!SetVariable CreateTitle """$UserInput$"""][!CommandMeasure MeasureScript "CreateSubmit()"]
OnDismissAction=[!CommandMeasure MeasureScript "CreateInputClosed()"]

; The box to type a start or end time in the card (opened by CardTime() over its chip)
[MeasureTimeInput]
Measure=Plugin
Plugin=InputText
FontFace=#FontFace#
FontSize=9
StringAlign=Center
FocusDismiss=1
TopMost=1
DefaultValue=
X=0
Y=0
W=60
H=20
Command1=[!SetVariable CreateTime """$UserInput$"""][!CommandMeasure MeasureScript "TimeSubmit()"]
OnDismissAction=[!CommandMeasure MeasureScript "TimeInputClosed()"]

[StyCal]
Group=Cal
UpdateDivider=-1

[StyShape]
Shape=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0

[StyStr]
FontFace=#FontFace#
FontSize=#FontSize#
FontWeight=400
AntiAlias=1
FontColor=31,31,31,255
Text=

[StyHidden]
Hidden=1

[StyBold]
FontWeight=600

[StySub]
FontSize=(#FontSize#-0.5)
FontWeight=400

[StyClip]
ClipString=1
W=10
H=10

; Clickable items: the tooltip comes from [Tip] (Calendar.lua: TipOver), and a press does
; not move the skin (Rainmeter drags the window where no meter has a LeftMouseDownAction)
[StyItem]
MouseOverAction=[!CommandMeasure MeasureScript "TipOver('#CURRENTSECTION#')"]
MouseLeaveAction=[!CommandMeasure MeasureScript "TipLeave('#CURRENTSECTION#')"]
LeftMouseDownAction=[!SetVariable WCPressed 1]

[StyWeekScroll]
MouseScrollUpAction=[!CommandMeasure MeasureScript "ShiftWeek(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureScript "ShiftWeek(1)"]

; Colors in this file are light-theme defaults: Calendar.lua applies the
; selected Theme (and any color overrides from Settings.inc) on every layout.
[BG]
Meter=Shape
MeterStyle=StyCal
Shape=Rectangle 0,0,#Width#,#Height#,#BgRadius# | Fill Color 255,255,255,255 | StrokeWidth 1 | Stroke Color 224,227,231,255

[Grid]
Meter=Shape
MeterStyle=StyCal | StyShape

; Creating items (Calendar.lua: CreateAt, CreateAllDay). One zone per day column over the
