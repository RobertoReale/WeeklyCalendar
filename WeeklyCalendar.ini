; Keeps dialogs (e.g. "Empty Recycle Bin") above the calendar: see @Resources\ZOrder.
; Started by Calendar.lua when KeepDialogsOnTop=1.
[MeasureZOrderHelper]
Measure=Plugin
Plugin=RunCommand
Program=cmd.exe
Parameter=/c "#@#ZOrder\launch.cmd"
StartInFolder=#@#ZOrder
State=Hide
Timeout=120000

; Marks Google Tasks completed / not completed from the skin (tools\GoogleTasksFeed.gs).
; Calendar.lua sets the address and runs it; curl.exe is part of Windows 10 and 11.
[MeasureTaskAction]
Measure=Plugin
Plugin=RunCommand
Program=curl.exe
Parameter=
State=Hide
OutputType=UTF8
Timeout=40000
FinishAction=[!CommandMeasure MeasureScript "TaskResult()"]

[StyCal]
Group=Cal
UpdateDivider=-1

[StyShape]
Shape=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0

[StyStr]
FontFace=#FontFace#
FontSize=#FontSize#
FontWeight=400
AntiAlias=1
FontColor=31,31,31,255
Text=

[StyHidden]
Hidden=1

[StyBold]
FontWeight=600

[StySub]
FontSize=(#FontSize#-0.5)
FontWeight=400

[StyClip]
ClipString=1
W=10
H=10

; Items with a tooltip: Calendar.lua shows it through [Tip] (see TipOver)
[StyTip]
MouseOverAction=[!CommandMeasure MeasureScript "TipOver('#CURRENTSECTION#')"]
MouseLeaveAction=[!CommandMeasure MeasureScript "TipLeave('#CURRENTSECTION#')"]

[StyWeekScroll]
MouseScrollUpAction=[!CommandMeasure MeasureScript "ShiftWeek(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureScript "ShiftWeek(1)"]

; Colors in this file are light-theme defaults: Calendar.lua applies the
; selected Theme (and any color overrides from Settings.inc) on every layout.
[BG]
Meter=Shape
MeterStyle=StyCal
Shape=Rectangle 0,0,#Width#,#Height#,#BgRadius# | Fill Color 255,255,255,255 | StrokeWidth 1 | Stroke Color 224,227,231,255

[Grid]
Meter=Shape
MeterStyle=StyCal | StyShape

[CalLogo]
Meter=Shape
MeterStyle=StyCal | StyShape | StyWeekScroll | StyTip
LeftMouseUpAction=["https://calendar.google.com"]

[CalLogoTxt]
Meter=String
MeterStyle=StyCal | StyStr | StyWeekScroll
StringAlign=CenterCenter
FontColor=255,255,255,255
FontSize=11
FontWeight=700
LeftMouseUpAction=["https://calendar.google.com"]

[CalAppTitle]
Meter=String
MeterStyle=StyCal | StyStr | StyWeekScroll | StyTip
StringAlign=LeftCenter
FontColor=31,31,31,255
FontSize=13
FontWeight=500
Text=Calendar
LeftMouseUpAction=["https://calendar.google.com"]

