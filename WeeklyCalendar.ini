; Dragging a task or an event to another day (Calendar.lua: DragStart, DragOver, DragDrop;
; DragEvent for the time of an event, with the DragSlot strips below).
; Hidden except while an item is pressed. They come after every chip and event,
; so they get the mouse during a drag: DragArea cancels a release outside the day
; columns, DragZone0..6 (one per column, or per month cell) track the cursor and take the
; drop. A right click cancels too; DragArea then stays until the left button is released.
[DragArea]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden
MouseActionCursorName=SizeAll
