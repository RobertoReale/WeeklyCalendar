; Dragging a task to another day (Calendar.lua: DragStart, DragOver, DragDrop).
; Hidden except while a task chip is pressed. They come after every chip and event,
; so they get the mouse during a drag: DragArea cancels a release outside the day
; columns, DragZone0..6 (one per column) track the cursor and take the drop.
[DragArea]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden
MouseActionCursorName=SizeAll
LeftMouseUpAction=[!CommandMeasure MeasureScript "DragCancel()"]
RightMouseUpAction=[!CommandMeasure MeasureScript "DragCancel()"]

[DragHi]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden

[DragPrev]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden

[DragPrevTx]
Meter=String
MeterStyle=StyCal | StyStr | StyHidden | StyClip
StringAlign=LeftCenter
FontColor=255,255,255,255
FontSize=8

[DragZone0]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden
MouseActionCursorName=SizeAll
MouseOverAction=[!CommandMeasure MeasureScript "DragOver(0)"]
LeftMouseUpAction=[!CommandMeasure MeasureScript "DragDrop(0)"]
RightMouseUpAction=[!CommandMeasure MeasureScript "DragCancel()"]

[DragZone1]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden
MouseActionCursorName=SizeAll
MouseOverAction=[!CommandMeasure MeasureScript "DragOver(1)"]
LeftMouseUpAction=[!CommandMeasure MeasureScript "DragDrop(1)"]
RightMouseUpAction=[!CommandMeasure MeasureScript "DragCancel()"]

[DragZone2]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden
MouseActionCursorName=SizeAll
MouseOverAction=[!CommandMeasure MeasureScript "DragOver(2)"]
LeftMouseUpAction=[!CommandMeasure MeasureScript "DragDrop(2)"]
RightMouseUpAction=[!CommandMeasure MeasureScript "DragCancel()"]

[DragZone3]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden
MouseActionCursorName=SizeAll
MouseOverAction=[!CommandMeasure MeasureScript "DragOver(3)"]
LeftMouseUpAction=[!CommandMeasure MeasureScript "DragDrop(3)"]
RightMouseUpAction=[!CommandMeasure MeasureScript "DragCancel()"]

[DragZone4]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden
MouseActionCursorName=SizeAll
MouseOverAction=[!CommandMeasure MeasureScript "DragOver(4)"]
LeftMouseUpAction=[!CommandMeasure MeasureScript "DragDrop(4)"]
RightMouseUpAction=[!CommandMeasure MeasureScript "DragCancel()"]

[DragZone5]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden
MouseActionCursorName=SizeAll
MouseOverAction=[!CommandMeasure MeasureScript "DragOver(5)"]
LeftMouseUpAction=[!CommandMeasure MeasureScript "DragDrop(5)"]
RightMouseUpAction=[!CommandMeasure MeasureScript "DragCancel()"]

[DragZone6]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden
MouseActionCursorName=SizeAll
MouseOverAction=[!CommandMeasure MeasureScript "DragOver(6)"]
LeftMouseUpAction=[!CommandMeasure MeasureScript "DragDrop(6)"]
RightMouseUpAction=[!CommandMeasure MeasureScript "DragCancel()"]

[NowLine]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden

[Status]
Meter=String
MeterStyle=StyCal | StyStr | StyHidden
X=(#Width#/2)
Y=(#Height#/2)
StringAlign=CenterCenter
FontColor=116,119,117,255
FontSize=11

; Carries the tooltip of the item under the cursor (Calendar.lua: TipOver). One tooltip
; window for the whole skin: Rainmeter creates a window for every meter with a tooltip.
[Tip]
Meter=Shape
MeterStyle=StyCal | StyShape | StyHidden
