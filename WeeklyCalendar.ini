MeterStyle=StyCal | StyStr | StyWeekScroll
StringAlign=CenterCenter
FontSize=16
FontWeight=600
Text=[\x2039]
LeftMouseUpAction=[!CommandMeasure MeasureScript "ShiftWeek(-1)"]

[BtnNext]
